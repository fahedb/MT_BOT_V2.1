name: CI

# Phase 0 of docs/REFACTOR_PLAN.md (finding E4: there was no CI and no tests).
# The build is gated on the pre-refactor baseline in tests/golden/baseline_v0,
# so any unintended change to the scoring math fails here.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cpp:
    name: C++ (${{ matrix.config }})
    runs-on: windows-2022
    strategy:
      fail-fast: false
      matrix:
        config: [Debug, Release]

    steps:
      - uses: actions/checkout@v4

      - name: Cache vcpkg binaries
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/vcpkg_cache
          key: vcpkg-${{ runner.os }}-${{ hashFiles('vcpkg.json') }}
          restore-keys: vcpkg-${{ runner.os }}-

      - name: Configure
        env:
          VCPKG_BINARY_SOURCES: clear;files,${{ github.workspace }}/vcpkg_cache,readwrite
        run: >
          cmake -B build -G "Visual Studio 17 2022" -A x64
          -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake"
          -DVCPKG_TARGET_TRIPLET=x64-windows
          -DMTBOT_BUILD_TESTS=ON
          -DMTBOT_WARNINGS_AS_ERRORS=ON

      - name: Build
        run: cmake --build build --config ${{ matrix.config }} --parallel

      # Unit tests gate every commit: fast, and they cover the scoring contract
      # from plan section 6.9 plus the golden baseline of the pre-refactor math.
      - name: Unit tests
        run: >
          ctest --test-dir build -C ${{ matrix.config }}
          --label-exclude integration --output-on-failure

      # Integration tests each build a full engine - channels, calibration,
      # embeddings and an ANN index over thousands of bars - so they are slower
      # and run separately rather than being skipped.
      - name: Integration tests
        run: >
          ctest --test-dir build -C ${{ matrix.config }}
          --label-regex integration --output-on-failure

      # The golden files are a committed artefact. If a change was supposed to
      # move the numbers, regenerate them in the same commit and say why in the
      # plan's progress log; CI must never rewrite them silently.
      - name: Golden baseline is unmodified
        run: |
          git diff --exit-code -- tests/golden
          if ($LASTEXITCODE -ne 0) { throw "golden baseline changed during the build" }

  python:
    name: Python syntax
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Byte-compile every script
        run: python -m compileall -q PYTH

  format:
    name: clang-format (new code only)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check formatting
        shell: bash
        run: |
          # Legacy sources are deliberately excluded until Phase 1 reformats
          # them module by module (see .clang-format for the reasoning).
          files=$(find tests libs apps -type f \
                    \( -name '*.cpp' -o -name '*.h' -o -name '*.hpp' \) 2>/dev/null || true)
          if [ -z "$files" ]; then
            echo "no new-code files to check"
            exit 0
          fi
          clang-format --version
          clang-format --dry-run --Werror $files
